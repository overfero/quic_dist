# TPU tensor-parallel test: single quic_dist rank (world_size: 1, so
# NO pipeline parallelism at all - the whole model lives on this one
# rank), but that rank's own attention/MLP Linear weights are sharded
# across all 8 v5e-8 chips via torch_xla SPMD (tensor_parallel_size: 8)
# - see tensor_parallel.py's module docstring for the mechanism and
# finetune.PipelineConfig.tensor_parallel_size's field comment for how
# this combines with (is layered under) PP when world_size > 1.
#
# Run: single process, rank 0 only (world_size=1 means there IS no
# rank 1..N - this is not a multi-rank launch):
#   python3 pipeline_finetune_rank.py configs/tpu_qwen25_0.5b_lora_tp8.yaml 0 http://localhost:8000

model_path: Qwen/Qwen2.5-0.5B
world_size: 1
num_layers: 24
tensor_parallel_size: 8

lora_r: 8
lora_alpha: 16
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

quantization: "none"
compute_dtype: bfloat16

dataset_name: tatsu-lab/alpaca
dataset_split: train
num_examples: 16
text_field: text

seq_len: 64
batch: 2
epochs: 2
lr: 0.0001
log_every: 1
