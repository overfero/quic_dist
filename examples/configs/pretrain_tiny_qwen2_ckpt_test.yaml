# Same as pretrain_tiny_qwen2.yaml, with checkpoint_dir/checkpoint_every
# set - a real kill-mid-run + resume validation config for the
# seed/checkpoint/log fields added to PretrainConfig this session (see
# docs/development-log.md).
#
# Run: python3 pretrain_pipeline_rank.py configs/pretrain_tiny_qwen2_ckpt_test.yaml <rank> <signaling_url>

tokenizer_path: Qwen/Qwen2.5-0.5B
world_size: 2
num_layers: 4

architecture: qwen2
hidden_size: 128
num_attention_heads: 4
num_key_value_heads: 4
intermediate_size: 344
max_position_embeddings: 512
compute_dtype: bfloat16

dataset_name: Salesforce/wikitext
dataset_config: wikitext-103-raw-v1
dataset_split: train
num_examples: 32
text_field: text
min_text_chars: 20

seq_len: 64
batch: 2
epochs: 2
lr: 0.0003
log_every: 1
connect_timeout_s: 300

seed: 123
checkpoint_dir: /tmp/pretrain_ckpt_test
checkpoint_every: 3
checkpoint_keep_last: 2
log_path: /tmp/pretrain_ckpt_test/log.jsonl
