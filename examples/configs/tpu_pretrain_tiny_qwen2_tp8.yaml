# TPU tensor-parallel test for pretrain.py (from-scratch, random-init
# model - no LoRA/quantization involved at all, the simplest case
# tensor_parallel.py handles): single quic_dist rank (world_size: 1,
# no pipeline parallelism), sharded across all 8 v5e-8 chips via
# torch_xla SPMD (tensor_parallel_size: 8).
#
# Run: python3 pretrain_pipeline_rank.py configs/tpu_pretrain_tiny_qwen2_tp8.yaml 0 http://localhost:8000

tokenizer_path: Qwen/Qwen2.5-0.5B
world_size: 1
num_layers: 4
tensor_parallel_size: 8

architecture: qwen2
hidden_size: 128
num_attention_heads: 4
num_key_value_heads: 4
intermediate_size: 344
max_position_embeddings: 512
compute_dtype: bfloat16

dataset_name: Salesforce/wikitext
dataset_config: wikitext-103-raw-v1
dataset_split: train
num_examples: 16
text_field: text
min_text_chars: 20

seq_len: 64
batch: 2
epochs: 2
lr: 0.0003
log_every: 1
connect_timeout_s: 300
