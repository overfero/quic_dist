# PPO on the same real 4-stage/2-machine/4-GPU topology. Reuses
# pipeline_generate (same real cross-machine-per-token cost as GRPO's
# config above), adds a value head + GAE + ppo_epochs=2 clipped-update
# passes per rollout - roughly 2x the forced-forward cost of GRPO's
# single pass, so kept even smaller (num_examples=3) for a first
# attempt.
#
# Run: python3 ppo_pipeline_rank.py configs/qwen38_27b_ppo.yaml <rank> <signaling_url>

model_path: /models/qwen38_27b
world_size: 4
num_layers: 64
stage_layer_counts: [17, 17, 18, 12]

# layers_attr etc left at their PLAIN defaults (model.layers) - see
# qwen38_27b_dpo.yaml's comment: the old model.model.* nesting no longer
# matches transformers>=5.15's current Qwen3_5ForCausalLM structure,
# reconfirmed via direct empirical inspection, not copied from memory.

lora_r: 8
lora_alpha: 16
lora_target_modules: [gate_proj, up_proj]

quantization: "4bit"
compute_dtype: bfloat16
cpu_offload_unused_layers: true
connect_timeout_s: 1800

dataset_name: tatsu-lab/alpaca
dataset_split: train
num_examples: 3
prompt_field: instruction
max_prompt_len: 16

group_size: 2
max_new_tokens: 6
temperature: 1.0
kl_coef: 0.05
gamma: 1.0
gae_lambda: 0.95
clip_eps: 0.2
vf_coef: 0.5
ppo_epochs: 1  # reduced from 2 - a real cross-machine attempt at 2 got stuck inside an
               # inner backward pass (rollout/ref/old all completed fine first); isolating
               # whether a single inner update completes, before assuming it's structural
epochs: 3
lr: 0.0001
log_every: 1
