# Real pretraining FROM SCRATCH - a genuinely small (real, randomly-
# initialized, not loaded from any checkpoint) Qwen2-architecture model,
# 2-stage pipeline (one rank per real machine for a cross-machine run).
# Reuses Qwen2.5-0.5B's real tokenizer (building a tokenizer from
# scratch is out of scope - see pretrain.py's module docstring) but
# NONE of its weights.
#
# Kept deliberately tiny (~80M params, dominated by the large real
# vocab embedding table - see PretrainConfig's docstring on why this
# isn't a config to casually scale up without revisiting the "replicate
# the whole model on every rank's CPU RAM" design) - this proves the
# real mechanism (random init -> real gradient descent -> real loss
# decrease on real text), not a production-scale pretrain.
#
# Run: python3 pretrain_pipeline_rank.py configs/pretrain_tiny_qwen2.yaml <rank> <signaling_url>

tokenizer_path: Qwen/Qwen2.5-0.5B
world_size: 2
num_layers: 8

architecture: qwen2
hidden_size: 256
num_attention_heads: 8
num_key_value_heads: 8
intermediate_size: 688
max_position_embeddings: 512
compute_dtype: bfloat16

dataset_name: Salesforce/wikitext  # namespaced repo id - "wikitext" (no owner) fails to resolve on
                                    # some datasets/huggingface_hub version combos (a real
                                    # HfUriError hit directly on one real machine, not the other)
dataset_config: wikitext-103-raw-v1
dataset_split: train
num_examples: 64
text_field: text
min_text_chars: 20

seq_len: 96
batch: 2
epochs: 3
lr: 0.0003
log_every: 4
connect_timeout_s: 1800
